# Nginx site for Venus Hotel. Copy to /etc/nginx/sites-available/venus and adjust
# server_name, root and the PHP-FPM socket, then: ln -s ../sites-available/venus /etc/nginx/sites-enabled/
server {
    listen 80;
    server_name example.com www.example.com;
    root /var/www/venus/public;
    index index.php;
    client_max_body_size 64M;

    # private folders
    location ~ ^/(app|storage)(/|$) { deny all; return 404; }
    location ~ /\.(?!well-known) { deny all; }
    # never run scripts from uploads
    location ~* ^/uploads/.*\.(php|phtml|phar|pl|py|cgi|sh)$ { deny all; }

    location / { try_files $uri $uri/ /index.php?$query_string; }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 300;
    }

    location ~* \.(css|js|woff2|svg)$ { expires 1y; add_header Cache-Control "public, immutable"; access_log off; }
    location ~* \.(jpg|jpeg|png|webp|gif)$ { expires 1y; access_log off; }

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml text/plain application/xml;
}
